[package]
name = "taskanchor"
version = "0.1.0"
description = "A tiny floating task anchor for staying focused."
authors = ["TaskAnchor"]
edition = "2021"

[lib]
name = "taskanchor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
